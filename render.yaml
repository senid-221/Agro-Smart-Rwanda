services:
  - type: web
    name: agrosmart-rwanda
    runtime: node
    plan: free
    region: oregon
    # Root directory is the repo root so BOTH server/ and public/ are deployed.
    # The Express app serves the API (/api) and the static frontend same-origin,
    # so no CORS or API_BASE changes are needed.
    buildCommand: cd server && npm install
    startCommand: node server/src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      # Render injects PORT automatically; the app reads process.env.PORT.
      # Neon pooled connection string (…-pooler.…neon.tech/…?sslmode=require).
      - key: DATABASE_URL
        sync: false
      # openssl rand -hex 32
      - key: JWT_SECRET
        sync: false
      # Google Identity Services OAuth Web client ID (public value).
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: OPENAI_VISION_MODEL
        value: gpt-4o-mini
      - key: TAVILY_API_KEY
        sync: false
      # Paystack (store-order mobile-money / card collection). Secret key stays
      # server-side; it also signs the webhook. Leave the secret blank to run
      # checkout as record-intent only. Start with TEST keys, then switch to LIVE.
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_PUBLIC_KEY
        sync: false
      - key: PAYSTACK_CURRENCY
        value: RWF
      # Base origin for the Paystack webhook + post-payment redirect:
      #   https://agro-smart-rwanda.onrender.com/api/paystack/webhook
      - key: PUBLIC_APP_URL
        value: https://agro-smart-rwanda.onrender.com
      # Admin auto-created on boot from these (email + password >= 8 chars).
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Admin
