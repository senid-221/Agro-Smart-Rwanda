<!doctype html>
<html lang="rw">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b5e20" />
    <meta name="description" content="AgroSmart Rwanda - AI crop disease detection and agriculture learning app for Rwandan farmers" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    <link rel="stylesheet" href="styles.css" />
    <title>AgroSmart Rwanda</title>
  </head>
  <body>
    <div id="app">
      <div class="splash">
        <img src="icon.png" alt="" width="96" height="96" />
        <p>AgroSmart Rwanda</p>
      </div>
    </div>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="js/ui.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/data/diseases.js"></script>
    <script src="js/data/crops.js"></script>
    <script src="js/data/rab.js"></script>
    <script src="js/data/fertilizers.js"></script>
    <script src="js/data/lessons.js"></script>
    <script src="js/data/products.js"></script>
    <script src="js/data/agro.js"></script>
    <script src="js/db.js"></script>
    <script src="js/custom.js"></script>
    <script src="js/api.js"></script>
    <script src="js/ai.js"></script>
    <script src="js/research.js"></script>
    <script src="js/engine/detector.js"></script>
    <script src="js/screens/home.js"></script>
    <script src="js/screens/scan.js"></script>
    <script src="js/screens/learn.js"></script>
    <script src="js/screens/library.js"></script>
    <script src="js/screens/fertilizer.js"></script>
    <script src="js/screens/store.js"></script>
    <script src="js/screens/assistant.js"></script>
    <script src="js/screens/case.js"></script>
    <script src="js/screens/dashboard.js"></script>
    <script src="js/screens/alerts.js"></script>
    <script src="js/screens/weather.js"></script>
    <script src="js/screens/map.js"></script>
    <script src="js/screens/community.js"></script>
    <script src="js/screens/expert.js"></script>
    <script src="js/screens/admin.js"></script>
    <script src="js/screens/settings.js"></script>
    <script src="js/screens/warroom.js"></script>
    <script src="js/app.js"></script>
    <script>
      if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
        window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}))
      }
    </script>
  </body>
</html>
